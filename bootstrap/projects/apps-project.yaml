apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
spec:
  description: User-facing applications - namespace-scoped only, except for their own Namespace
  sourceRepos:
    - https://gitea.tiver212.ru/tiver/k3s-gitops.git
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  # Namespace is the one cluster-scoped resource apps may create: the
  # ApplicationSet syncs with CreateNamespace=true, so a new apps/<name>/
  # cannot deploy itself without it. ClusterRole/ClusterRoleBinding/CRDs
  # stay forbidden - that is the boundary this project exists to enforce.
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
