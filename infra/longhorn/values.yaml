longhorn:
  preUpgradeChecker:
    jobEnabled: false

  persistence:
    defaultClass: true
    defaultClassReplicaCount: 2

  defaultSettings:
    taintToleration: "storage-only=true:NoSchedule"
    nodeDownPodDeletionPolicy: "delete-both-statefulset-and-deployment-pod"
    replicaAutoBalance: "best-effort"
    storageOverProvisioningPercentage: 200
    storageMinimalAvailablePercentage: 15

  longhornManager:
    tolerations:
      - key: "storage-only"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"

  longhornDriver:
    tolerations:
      - key: "storage-only"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
