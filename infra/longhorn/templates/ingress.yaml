apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: longhorn-ui-ingress
  namespace: longhorn-system
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/whitelist-source-range: "192.168.0.0/24,192.168.88.0/24"
spec:
  tls:
    - hosts:
        - longhorn.tiver212.ru
      secretName: longhorn-ui-tls

  rules:
    - host: longhorn.tiver212.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: longhorn-frontend
                port:
                  number: 80
