kube-prometheus-stack:
  # We run a single-node-ish homelab; disable components that assume a
  # managed/HA control plane we don't have or can't scrape on k3s.
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false
  kubeEtcd:
    enabled: false

  alertmanager:
    enabled: true
    # No receivers wired yet - notifications are deferred until Stalwart
    # mail is up. Alerts still collect and are visible in the UI.
    alertmanagerSpec:
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: longhorn
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 2Gi

  prometheus:
    prometheusSpec:
      retention: 15d
      # Size cap is what actually protects the volume: with only a time
      # limit the TSDB/WAL filled the 10Gi PVC and Prometheus crash-looped
      # for weeks on "no space left on device". Keep it ~80% of the PVC so
      # the WAL and compaction still have headroom.
      retentionSize: 16GB
      # Discover ServiceMonitors/PodMonitors from all namespaces, not just
      # those with the release's helm labels - so app charts can ship their
      # own ServiceMonitor without extra label wiring.
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: longhorn
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                # Raised from 10Gi. Neither the operator nor the StatefulSet
                # grows an existing PVC: patch the PVC to 20Gi by hand once
                # (Longhorn allows expansion), then delete the StatefulSet
                # with --cascade=orphan so the operator recreates it.
                storage: 20Gi

  grafana:
    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password
    persistence:
      enabled: true
      storageClassName: longhorn
      accessModes: ["ReadWriteOnce"]
      size: 2Gi
    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        cert-manager.io/cluster-issuer: "letsencrypt-prod"
      hosts:
        - grafana.tiver212.ru
      tls:
        - hosts:
            - grafana.tiver212.ru
          secretName: grafana-tls-secret
