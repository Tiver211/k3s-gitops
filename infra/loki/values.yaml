loki:
  deploymentMode: SingleBinary

  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    storage:
      type: filesystem
    limits_config:
      retention_period: 720h
    compactor:
      retention_enabled: true
      delete_request_store: filesystem
    pattern_ingester:
      enabled: false
    ruler:
      enable_api: false

  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      storageClass: nfs-media
      size: 40Gi

  # Disable everything scalable / extra - homelab single binary only
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  lokiCanary:
    enabled: false
  test:
    enabled: false
  gateway:
    enabled: false
  minio:
    enabled: false
