apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: degoog
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # authentik forward-auth (Forward Auth - Single Application mode, via
    # the built-in embedded outpost). Every request to this host is
    # authenticated against authentik before reaching degoog - anonymous
    # visitors get redirected to sso.tiver212.ru to log in first.
    #
    # auth-url uses the public hostname deliberately: authentik's embedded
    # outpost matches which app a check belongs to by the raw Host header
    # of the request (verified live), and auth-snippet cannot override Host
    # on the internal _external-auth-* location ingress-nginx generates for
    # auth-url - it's hardcoded from auth-url's own authority, snippet
    # content never reached that block (checked the rendered nginx.conf).
    # That loops the subrequest back through this same hostname -
    # infra/ingress-nginx's hostAliases resolves it to 127.0.0.1 instead of
    # going out through Cloudflare (verified live: it did, and timed out).
    #
    # The outpost's own /outpost.goauthentik.io path is NOT in this Ingress
    # (see ingress-outpost.yaml) on purpose: auth-url/auth-signin annotations
    # apply to every path in the Ingress that carries them, so keeping that
    # path here would make the auth subrequest itself require auth -
    # infinite recursion (verified live: the exact same request retried
    # dozens of times with growing latency, then 499). A second,
    # annotation-free Ingress for the same host is the standard way to
    # exempt one path.
    nginx.ingress.kubernetes.io/auth-url: "https://search.tiver212.ru/outpost.goauthentik.io/auth/nginx"
    nginx.ingress.kubernetes.io/auth-signin: "https://search.tiver212.ru/outpost.goauthentik.io/start?rd=$escaped_request_uri"
    nginx.ingress.kubernetes.io/auth-response-headers: "Set-Cookie"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - search.tiver212.ru
      secretName: degoog-tls-secret
  rules:
    - host: search.tiver212.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: degoog
                port:
                  number: 4444
