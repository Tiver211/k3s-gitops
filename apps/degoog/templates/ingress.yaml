apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: degoog
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - search.tiver212.ru
      secretName: degoog-tls-secret
  rules:
    - host: search.tiver212.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: degoog
                port:
                  number: 4444
