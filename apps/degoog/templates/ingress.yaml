apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: degoog
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # authentik forward-auth (Forward Auth - Single Application mode, via
    # the built-in embedded outpost). Every request to this host is
    # authenticated against authentik before reaching degoog - anonymous
    # visitors get redirected to sso.tiver212.ru to log in first.
    #
    # auth-url MUST stay cluster-internal: it's a server-side subrequest, and
    # pointing it at the public hostname sends it back out through
    # Cloudflare and around - verified live (ingress-nginx access log showed
    # the same request retried dozens of times with growing latency until it
    # 500'd). auth-signin is different: it's a browser redirect, so it has to
    # be the public URL.
    nginx.ingress.kubernetes.io/auth-url: "http://authentik-outpost.degoog.svc.cluster.local/outpost.goauthentik.io/auth/nginx"
    nginx.ingress.kubernetes.io/auth-signin: "https://search.tiver212.ru/outpost.goauthentik.io/start?rd=$escaped_request_uri"
    nginx.ingress.kubernetes.io/auth-response-headers: "Set-Cookie"
    nginx.ingress.kubernetes.io/auth-snippet: |
      proxy_set_header X-Forwarded-Host $http_host;
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - search.tiver212.ru
      secretName: degoog-tls-secret
  rules:
    - host: search.tiver212.ru
      http:
        paths:
          # More specific path first: the outpost's own auth/start/callback
          # endpoints must reach authentik-server, not degoog, on this same
          # host (see authentik-outpost-service.yaml for why an
          # ExternalName Service is needed to cross into the authentik
          # namespace).
          - path: /outpost.goauthentik.io
            pathType: Prefix
            backend:
              service:
                name: authentik-outpost
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: degoog
                port:
                  number: 4444
