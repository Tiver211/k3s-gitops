apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: vpn-bot-db
spec:
  instances: 1

  # imageName intentionally left unset - use this CNPG operator's own
  # tested default rather than pinning a version to match, matching the
  # rest of this repo (see remnawave-db, seaweedfs-db).
  storage:
    storageClass: {{ .Values.postgres.storageClass }}
    size: {{ .Values.postgres.size }}

  bootstrap:
    initdb:
      database: {{ .Values.postgres.database }}
      owner: {{ .Values.postgres.owner }}

  monitoring:
    enablePodMonitor: true

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
