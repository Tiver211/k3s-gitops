global:
  env:
    - name: AUTHENTIK_POSTGRESQL__PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-db-app
          key: password
  envFrom:
    - secretRef:
        name: authentik-secret-key
    - secretRef:
        name: authentik-paperless-oidc
    - secretRef:
        name: authentik-memos-oidc

authentik:
  authentik:
    postgresql:
      host: authentik-db-rw
      name: authentik
      user: authentik
      port: 5432

  blueprints:
    configMaps:
      - authentik-blueprint-groups
      - authentik-blueprint-passwordless
      - authentik-blueprint-invitation-enrollment
      - authentik-blueprint-paperless
      - authentik-blueprint-paperless-access
      - authentik-blueprint-memos
      - authentik-blueprint-search
      - authentik-blueprint-tiver-theme

  server:
    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - sso.tiver212.ru
      tls:
        - secretName: authentik-tls
          hosts:
            - sso.tiver212.ru
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    # Mounted at /data, not the /data/media symlink target /media: authentik's
    # file-manager checks manageable() via pathlib Path.is_mount(), which does
    # NOT follow symlinks here (verified live - os.path.ismount('/media')
    # returns True through the symlink, but Path('./data/media').is_mount()
    # stays False; only Path('/data').is_mount() is reliably True). Needed
    # for uploaded branding assets (logo, flow background); nothing else uses
    # it yet. See pvc-media.yaml.
    volumes:
      - name: media
        persistentVolumeClaim:
          claimName: authentik-media
    volumeMounts:
      - name: media
        mountPath: /data

  worker:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    volumes:
      - name: media
        persistentVolumeClaim:
          claimName: authentik-media
    volumeMounts:
      - name: media
        mountPath: /data

  serviceAccount:
    create: false
