authentik:
  postgresql:
    enabled: false

  redis:
    enabled: false

  server:
    ingress:
      enabled: true
      ingressClassName: "nginx"
      annotations:
        cert-manager.io/cluster-issuer: "cloudflare-issuer"
      hosts:
        - sso.tiver212.ru
      paths:
        - /
      pathType: Prefix
      tls:
        - secretName: authentik-tls-secret
          hosts:
            - sso.tiver212.ru

    # Монтируем ConfigMap с чертежами в веб-сервер
    volumes:
      - name: custom-blueprints
        configMap:
          name: authentik-custom-blueprints
    volumeMounts:
      - name: custom-blueprints
        mountPath: /blueprints/custom
        readOnly: true

    env: &env-config
      - name: AUTHENTIK_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: authentik-secret-key
            key: AUTHENTIK_SECRET_KEY

      - name: AUTHENTIK_POSTGRESQL__HOST
        valueFrom:
          secretKeyRef:
            name: authentik-db-app
            key: host
      - name: AUTHENTIK_POSTGRESQL__NAME
        valueFrom:
          secretKeyRef:
            name: authentik-db-app
            key: dbname
      - name: AUTHENTIK_POSTGRESQL__USER
        valueFrom:
          secretKeyRef:
            name: authentik-db-app
            key: user
      - name: AUTHENTIK_POSTGRESQL__PASSWORD
        valueFrom:
          secretKeyRef:
            name: authentik-db-app
            key: password

      - name: AUTHENTIK_REDIS__HOST
        value: "authentik-redis"

  worker:
    env: *env-config

    # Монтируем ConfigMap с чертежами в воркер (он отвечает за импорт чертежей)
    volumes:
      - name: custom-blueprints
        configMap:
          name: authentik-custom-blueprints
    volumeMounts:
      - name: custom-blueprints
        mountPath: /blueprints/custom
        readOnly: true

  # Внутренние настройки Authentik (базовые параметры самого приложения)
  authentik:
    # Заготовка для интеграции почты по SMTP
    email:
      host: ""
      port: 587
      username: ""
      password: ""
      use_tls: false
      use_ssl: false
      from: ""
