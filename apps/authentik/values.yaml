global:
  env:
    - name: AUTHENTIK_POSTGRESQL__PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-db-app
          key: password
  envFrom:
    - secretRef:
        name: authentik-secret-key
    - secretRef:
        name: authentik-paperless-oidc

authentik:
  authentik:
    postgresql:
      host: authentik-db-rw
      name: authentik
      user: authentik
      port: 5432

  blueprints:
    configMaps:
      - authentik-blueprint-paperless

  server:
    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - sso.tiver212.ru
      tls:
        - secretName: authentik-tls
          hosts:
            - sso.tiver212.ru
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

  worker:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

  serviceAccount:
    create: false
