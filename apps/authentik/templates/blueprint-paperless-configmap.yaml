apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-paperless
data:
  # Filename must end in .yaml - authentik's blueprint discovery only picks
  # up files with that extension from the mounted directory.
  paperless-oidc.yaml: |
    version: 1
    metadata:
      name: paperless-ngx OIDC
    entries:
      # Validated via the live instance's own importer (Importer.from_string
      # (...).validate(), transactional, rolled back) before this was
      # committed - see memory/authentik-blueprint-gotchas.md for why that
      # matters here specifically.
      - id: paperless-ngx-provider
        model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: paperless-ngx
        attrs:
          client_type: confidential
          client_id: !Env AUTHENTIK_PAPERLESS_CLIENT_ID
          client_secret: !Env AUTHENTIK_PAPERLESS_CLIENT_SECRET
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          redirect_uris:
            - matching_mode: strict
              url: "https://paperless.tiver212.ru/accounts/oidc/authentik/login/callback/"
              redirect_uri_type: authorization
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      - model: authentik_core.application
        identifiers:
          slug: paperless-ngx
        attrs:
          name: Paperless-ngx
          provider: !KeyOf paperless-ngx-provider
          policy_engine_mode: any
          open_in_new_tab: false
