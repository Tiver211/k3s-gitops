apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-matrix
data:
  matrix-oidc.yaml: |
    version: 1
    metadata:
      name: Matrix (Synapse) OIDC
    entries:
      - model: authentik_core.group
        identifiers:
          name: matrix-admin
        attrs:
          is_superuser: false
      - model: authentik_core.group
        identifiers:
          name: matrix-user
        attrs:
          is_superuser: false
      - model: authentik_core.group
        identifiers:
          name: matrix-viewer
        attrs:
          is_superuser: false

      - id: matrix-provider
        model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: matrix
        attrs:
          client_type: confidential
          client_id: !Env AUTHENTIK_MATRIX_CLIENT_ID
          client_secret: !Env AUTHENTIK_MATRIX_CLIENT_SECRET
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          redirect_uris:
            - matching_mode: strict
              url: "https://matrix.tiver212.ru/_synapse/client/oidc/callback"
              redirect_uri_type: authorization
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

      - model: authentik_core.application
        identifiers:
          slug: matrix
        attrs:
          name: Matrix
          provider: !KeyOf matrix-provider
          policy_engine_mode: any
          open_in_new_tab: false

      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, matrix]]
          group: !Find [authentik_core.group, [name, matrix-admin]]
        attrs:
          order: 0
          enabled: true
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, matrix]]
          group: !Find [authentik_core.group, [name, matrix-user]]
        attrs:
          order: 1
          enabled: true
