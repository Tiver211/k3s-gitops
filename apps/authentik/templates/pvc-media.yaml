apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authentik-media
spec:
  # RWX because server and worker both mount this at once (worker writes
  # uploads, server serves them back) - see values.yaml server/worker.volumes.
  # nfs-media rather than longhorn per repo convention for RWX (see CLAUDE.md).
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-media
  resources:
    requests:
      storage: 2Gi
