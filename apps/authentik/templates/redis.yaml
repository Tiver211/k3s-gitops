apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: Redis
metadata:
  name: authentik-redis
spec:
  kubernetesConfig:
    image: quay.io/opstree/redis:v7.2.5
    imagePullPolicy: IfNotPresent

  redisExporter:
    enabled: true
    image: quay.io/opstree/redis-exporter:v1.86.0

  storage:
    volumeClaimTemplate:
      spec:
        storageClassName: longhorn
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
