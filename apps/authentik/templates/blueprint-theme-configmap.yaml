apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-tiver-theme
data:
  # Generated by TiverEco/themes/authentik/tools/build.mjs - do not edit by
  # hand. Regenerate there and copy verbatim; see that repo's README for the
  # source CSS (src/*.css) this compiles from.
  tiver-brand-theme.yaml: |
    # Generated by tools/build.mjs — do not edit.
    # Regenerate with:  node tools/build.mjs
    #
    # Applies the TIVER theme to an authentik brand, declaratively.
    #
    # Mount this file anywhere under authentik's blueprints directory
    # (`blueprints_dir`, /blueprints by default) — see deploy/ for a Kubernetes
    # ConfigMap and a docker-compose bind mount. authentik discovers it and
    # applies it on start and on change; no restart of the worker is needed.
    #
    # To target a brand other than the default one, set the `brand_domain`
    # context value — for example with a second blueprint that imports this one,
    # or by editing the `context:` block below. If no brand with that domain
    # exists, this blueprint does nothing: it never creates one.
    version: 1
    metadata:
      name: TIVER theme
      labels:
        blueprints.goauthentik.io/description: >-
          TIVER design system applied to the authentik admin interface, user
          interface and flow executor.
    context:
      brand_domain: authentik-default
    entries:
      # authentik applies discovered blueprints concurrently, and on a first start
      # this one can otherwise be applied *before* the brand it wants to restyle
      # exists. Ordering it after `Default - Brand` is what keeps that from
      # happening. `required: false` so an install that ships no default
      # blueprints still applies this one (the condition below covers that case).
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Default - Brand
          required: false

      - model: authentik_brands.brand
        # Only ever an update. `state: present` would happily create the brand,
        # and a brand created here would have no authentication flow and would not
        # be the default one — an instance that cannot log anyone in, and a theme
        # that is never served. The condition makes the entry a no-op instead.
        state: present
        conditions:
          - !Find [authentik_brands.brand, [domain, !Context [brand_domain, authentik-default]]]
        identifiers:
          domain: !Context [brand_domain, authentik-default]
        attrs:
          branding_custom_css: |
            /*!
             * TIVER theme for authentik
             * 7 sources, built from TiverEco/themes/authentik/src by tools/build.mjs.
             *
             * Do not edit this file. Edit src/ and rebuild:  node tools/build.mjs
             *
             * Paste into authentik: System > Brands > <brand> > Custom CSS,
             * or apply the blueprint in blueprints/. See README.md.
