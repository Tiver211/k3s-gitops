apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-passwordless
data:
  passwordless.yaml: |
    version: 1
    metadata:
      name: Passwordless-first login
      labels:
        blueprints.goauthentik.io/description: >-
          Offers WebAuthn/passkey as the first login factor via conditional
          UI on the identification page (IdentificationStage.webauthn_stage),
          alongside the existing username+password path - does not replace
          or require it. Distinct from the mfa-validation stage already
          bound inside default-authentication-flow, which is the *second*
          factor after password.
    entries:
      - id: passwordless-webauthn-validate
        model: authentik_stages_authenticator_validate.authenticatorvalidatestage
        identifiers:
          name: passwordless-first-webauthn-validate
        attrs:
          # skip, not deny: users with no passkey registered must fall
          # through to the normal username+password path untouched.
          not_configured_action: skip
          device_classes:
            - webauthn
      - model: authentik_stages_identification.identificationstage
        identifiers:
          name: default-authentication-identification
        attrs:
          # Every field re-declared as-is (verified against the live
          # instance) except webauthn_stage - updating a blueprint entry
          # re-validates the whole object, so a partial attrs block would
          # reset the rest to field defaults. user_fields keeps email
          # (explicit decision: removing it was considered and rejected
          # for compatibility - see git history for this file).
          user_fields:
            - email
            - username
          case_insensitive_matching: true
          show_matched_user: true
          pretend_user_exists: true
          enable_remember_me: false
          show_source_labels: false
          webauthn_stage: !KeyOf passwordless-webauthn-validate
