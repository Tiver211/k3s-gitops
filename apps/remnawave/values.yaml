replicaCount: 1

image:
  repository: remnawave/backend
  tag: "3"
  pullPolicy: IfNotPresent

domain: remnawave.tiver212.ru

service:
  port: 3000

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    secretName: remnawave-tls-secret

postgres:
  storageClass: longhorn
  size: 5Gi

redis:
  image: valkey/valkey:9-alpine

subscriptionPage:
  image:
    repository: remnawave/subscription-page
    tag: "8.0.0"
  domain: sub.remnawave.tiver212.ru
  port: 3010

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi
