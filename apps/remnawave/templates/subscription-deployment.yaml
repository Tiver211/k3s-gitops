apiVersion: apps/v1
kind: Deployment
metadata:
  name: remnawave-subscription-page
  labels:
    app: remnawave-subscription-page
spec:
  replicas: 1
  selector:
    matchLabels:
      app: remnawave-subscription-page
  template:
    metadata:
      labels:
        app: remnawave-subscription-page
    spec:
      containers:
        - name: subscription-page
          image: "{{ .Values.subscriptionPage.image.repository }}:{{ .Values.subscriptionPage.image.tag }}"
          env:
            - name: APP_PORT
              value: {{ .Values.subscriptionPage.port | quote }}
            # Same namespace as the panel Service (`remnawave`, port from
            # .Values.service.port) - internal ClusterIP, no ingress hop.
            - name: REMNAWAVE_PANEL_URL
              value: "http://remnawave:{{ .Values.service.port }}"
            - name: TRUST_PROXY
              value: "1"
          envFrom:
            - secretRef:
                name: remnawave-subscription-token
          ports:
            - name: http
              containerPort: {{ .Values.subscriptionPage.port }}
              protocol: TCP
          # httpGet doesn't work here: kubelet probes hit the pod IP
          # directly, bypassing ingress-nginx entirely, so they never carry
          # the X-Forwarded-Proto/X-Forwarded-For headers this app's
          # ProxyCheckMiddleware requires on every request - it drops any
          # request missing them (connection reset, not even a 4xx).
          # Confirmed live: curl from inside the pod itself got "empty
          # reply from server". TCP is the only probe type that doesn't
          # go through that middleware.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          # 128Mi was too tight for this Nest.js app - caught live at
          # 111Mi/128Mi (87%) while wedged: TCP accepted new connections
          # (readiness stayed green) but the event loop was too
          # GC-starved to ever write a response, so every request timed
          # out as "empty reply from server" - both through ingress-nginx
          # and hitting the pod directly. Not a keepalive/proxy-header
          # issue (ruled out live: explicit X-Forwarded-* headers didn't
          # help either) - real memory pressure. TCP-only probes can't
          # detect this failure mode (port stays open) - if this recurs
          # after the higher limit, the probe design needs revisiting too.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
