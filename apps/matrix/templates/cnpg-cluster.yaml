apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: matrix-db
spec:
  instances: 1

  storage:
    storageClass: longhorn
    size: 5Gi

  bootstrap:
    initdb:
      database: synapse
      owner: synapse
      # Fixed credentials (not CNPG's auto-generated ones) because Synapse's
      # homeserver.yaml embeds the DB password as a static value - same
      # reasoning as authentik's fixed OIDC secrets (CLAUDE.md: never let
      # something else generate a secret this app needs to reference itself).
      secret:
        name: matrix-db-credentials

  monitoring:
    enablePodMonitor: true

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
