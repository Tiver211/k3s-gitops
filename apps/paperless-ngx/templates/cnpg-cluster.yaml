apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: paperless-ngx-db
spec:
  instances: 1

  storage:
    storageClass: longhorn
    size: 10Gi

  bootstrap:
    initdb:
      database: paperless
      owner: paperless

  monitoring:
    enablePodMonitor: true

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
