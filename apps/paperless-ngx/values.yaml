paperless-ngx:
  # Chart (charts.gabe565.com) lags upstream (its latest still ships app
  # 2.14.7 vs upstream 3.1.3) - overriding the tag directly instead of
  # waiting on the chart. paperless-ngx's own startup check
  # (paperless.checks.E002) refuses a jump straight to v3 from anything
  # other than v2.20.15 exactly (verified live: it crash-looped going
  # 2.14.7 -> 3.1.3 directly, "last applied documents migration is
  # '1061_...', expected '1075_workflowaction_order' (v2.20.15)"). Went
  # through 2.20.15 first as the required intermediate step, confirmed
  # healthy with migrations applied, then bumped here to 3.1.3.
  image:
    tag: "3.1.3"

  # Chart bundles Bitnami postgresql/redis subcharts by default - disabled
  # in favor of CNPG and redis-operator, matching every other app in this
  # repo (see remnawave, authentik).
  postgresql:
    enabled: false
  redis:
    enabled: false

  env:
    PAPERLESS_DBENGINE: postgresql
    PAPERLESS_DBHOST: paperless-ngx-db-rw
    PAPERLESS_DBPORT: "5432"
    PAPERLESS_DBNAME: paperless
    # PAPERLESS_REDIS: no auth needed - redis-operator Redis CR ships with
    # none by default (verified empirically against the live operator, see
    # remnawave-redis), matching this app's own broker use case (scheduled
    # tasks/celery, not a data store).
    PAPERLESS_REDIS: redis://paperless-ngx-redis:6379
    PAPERLESS_TIME_ZONE: Europe/Moscow
    # Fixed admin, created at first boot - no interactive setup step needed
    # (unlike Trilium, which has no equivalent env-based bootstrap).
    PAPERLESS_ADMIN_USER: admin
    PAPERLESS_ADMIN_MAIL: admin@tiver212.ru
    # OIDC now that authentik is live again.
    PAPERLESS_SOCIAL_AUTO_SIGNUP: "true"
    PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS: "true"
    # Role sync: paperless-ngx has this built in (paperless/signals.py,
    # wired to allauth's social_account_updated signal - fires on every SSO
    # login, not just account creation). The "groups" claim comes for free
    # from authentik's own default "profile" scope mapping, which already
    # emits `"groups": [group.name for group in request.user.groups.all()]`
    # (verified live via ScopeMapping.evaluate against a real user) - no
    # authentik-side change needed, group names match the CLAUDE.md
    # convention exactly. SYNC_STAFF_GROUP is deliberately unset: with only
    # SYNC_SUPERUSER_GROUP set, is_staff falls back to mirroring
    # is_superuser (see the elif branch in signals.py), so paperless-user
    # members get plain access with no staff/admin surface.
    PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS: "true"
    PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS_CLAIM: groups
    PAPERLESS_SOCIAL_ACCOUNT_SYNC_SUPERUSER_GROUP: paperless-admin
    # SOCIALACCOUNT_PROVIDERS alone isn't enough - allauth's openid_connect
    # provider app has to be added to INSTALLED_APPS via PAPERLESS_APPS,
    # or its URLs/login button never get registered at all (verified: without
    # this, /accounts/oidc/.../login/ just 302s back to the login page).
    PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect

    # PAPERLESS_DBUSER/DBPASS come from CNPG's own generated secret, not our
    # SealedSecret - same reasoning as every other CNPG-backed app here:
    # never duplicate a password an operator already manages. This chart's
    # env map takes either a plain string or a `valueFrom` object inline -
    # verified by rendering; there's no separate envValueFrom key.
    PAPERLESS_DBUSER:
      valueFrom:
        secretKeyRef:
          name: paperless-ngx-db-app
          key: username
    PAPERLESS_DBPASS:
      valueFrom:
        secretKeyRef:
          name: paperless-ngx-db-app
          key: password

  # PAPERLESS_SECRET_KEY (required - the app refuses to start without it)
  # and PAPERLESS_ADMIN_PASSWORD come from the SealedSecret via envFrom,
  # not this env block, so they're never in git as plaintext.
  envFrom:
    - secretRef:
        name: paperless-ngx-secrets
    # PAPERLESS_SOCIALACCOUNT_PROVIDERS - the whole JSON blob is sealed
    # since the OIDC client secret lives inside it (django-allauth expects
    # one JSON value here, not discrete fields).
    - secretRef:
        name: paperless-ngx-oidc

  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

  persistence:
    data:
      enabled: true
      storageClass: longhorn
      accessMode: ReadWriteOnce
      size: 5Gi
    media:
      enabled: true
      storageClass: nfs-media
      accessMode: ReadWriteMany
      size: 50Gi
    consume:
      storageClass: nfs-media
      accessMode: ReadWriteMany
      size: 10Gi
    export:
      storageClass: nfs-media
      accessMode: ReadWriteMany
      size: 10Gi

  ingress:
    main:
      enabled: true
      annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: 64m
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - host: paperless.tiver212.ru
          paths:
            - path: /
      tls:
        - secretName: paperless-ngx-tls-secret
          hosts:
            - paperless.tiver212.ru
