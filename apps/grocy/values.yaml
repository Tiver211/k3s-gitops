app-template:
  controllers:
    main:
      type: deployment
      strategy: Recreate
      containers:
        main:
          image:
            repository: ghcr.io/linuxserver/grocy
            # Pinned: `latest` let an unreviewed image roll in on every
            # restart. v4.7.1-ls346 is the build live after the 2026-10-22
            # emergency fix (sha256:d63bffe9…, checked on ghcr).
            tag: v4.7.1-ls346
          ports:
            - name: http
              containerPort: 80

  service:
    main:
      controller: main
      ports:
        http:
          port: 80

  ingress:
    main:
      enabled: true
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: "letsencrypt-prod"
      hosts:
        - host: grocy.tiver212.ru
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
      tls:
        - hosts:
            - grocy.tiver212.ru
          secretName: grocy-tls-secret

  persistence:
    config:
      enabled: true
      type: persistentVolumeClaim
      storageClass: longhorn
      accessMode: ReadWriteOnce
      size: 4Gi
      globalMounts:
        - path: /config
