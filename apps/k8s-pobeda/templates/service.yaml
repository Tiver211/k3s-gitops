apiVersion: v1
kind: Service
metadata:
  name: k8s-pobeda
  namespace: {{ .Release.Namespace }}
  labels:
    app: k8s-pobeda
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: k8s-pobeda
