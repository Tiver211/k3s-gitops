apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: erpnext
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/tiver/k3s-gitops.git' # Replace with actual GitOps repo URL
    targetRevision: HEAD
    path: apps/erpnext
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: erpnext
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    createNamespace: true
