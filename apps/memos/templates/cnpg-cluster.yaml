apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: memos-db
spec:
  instances: 1

  storage:
    storageClass: longhorn
    size: 5Gi

  bootstrap:
    initdb:
      database: memos
      owner: memos

  monitoring:
    enablePodMonitor: true

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
